<h2>Ask a question</h2>
<form class="cu-form" onsubmit="return false">
  <div class="cu-form-item"><label class="cu-label" for="pg-name">Your name</label><input class="cu-input" id="pg-name" autocomplete="name"></div>
  <div class="cu-form-item"><label class="cu-label" for="pg-topic">Topic</label><select class="cu-select" id="pg-topic"><option>Access</option><option>Training</option><option>Something else</option></select></div>
  <div class="cu-cluster"><button class="cu-button" type="submit">Send</button><button class="cu-button cu-button--secondary" type="reset">Clear</button></div>
</form>
